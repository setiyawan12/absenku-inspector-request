name: Build Electron App

on:
  push:
    tags:
      - 'v*'          # trigger saat push tag: git tag v1.0.0 && git push --tags
  workflow_dispatch:  # atau trigger manual dari GitHub UI

jobs:
  # ── macOS (DMG) ──────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download cloudflared (arm64 + x64)
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar xz
          mv cloudflared cloudflared-arm64
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz | tar xz
          mv cloudflared cloudflared-x64
          # Use arm64 as default binary (user machines will download correct arch at runtime)
          cp cloudflared-arm64 cloudflared
          chmod +x cloudflared

      - run: npm install

      - name: Build DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg

  # ── Windows (NSIS .exe) ───────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download cloudflared (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - run: npm install

      - name: Build EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/*.exe

  # ── Linux (DEB + AppImage) ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download cloudflared (Linux x64)
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - run: npm install

      - name: Build DEB + AppImage
        run: npm run build:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
