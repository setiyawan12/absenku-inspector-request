name: Build Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GITHUB_TOKEN perlu write access untuk upload artifact ke GitHub Releases
permissions:
  contents: write

jobs:
  # ── macOS (DMG) ──────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download cloudflared (arm64)
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar xz
          chmod +x cloudflared

      - run: npm install

      - name: Build DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-dmg
          path: dist/*.dmg

  # ── Windows (NSIS .exe) ───────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download cloudflared (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - run: npm install

      - name: Build EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-installer
          path: dist/*.exe

  # ── Linux (DEB + AppImage) ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download cloudflared (Linux x64)
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - run: npm install

      - name: Build DEB + AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
